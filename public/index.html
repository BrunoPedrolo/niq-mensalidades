<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIQ — Controle de Mensalidades</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--am:#F5C800;--am2:#c9a200;--amL:#fffbea;--vd:#3A8C3F;--vd2:#2A6B2E;--vdL:#e8f5e9;--bg:#f2f3f0;--card:#fff;--bo:#e3e3de;--tx:#1a1a1a;--ts:#666;--tl:#9a9a9a;--rd:#d32f2f;--rdL:#ffebee;--ye:#b8860b;--yeL:#fff8e1;--bl:#1565c0;--blL:#e3f0fc;--pu:#6a1b9a;--puL:#f3e5f5;--r:12px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.35}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
b,strong{font-weight:800}

/* ===== LOGIN ===== */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#fff 0,#fff 38%,var(--bg) 38%)}
.lg-card{background:#fff;border:1px solid var(--bo);border-radius:18px;box-shadow:var(--sh);padding:28px 28px 22px;width:100%;max-width:400px;text-align:center}
.lg-card .logo-img{height:104px;border-radius:6px;margin-bottom:12px}
.lg-card h1{font-size:19px;font-weight:900}
.lg-card .sub{color:var(--ts);font-weight:700;font-size:12.5px;margin:2px 0 18px}
.lg-pass{position:relative;margin-bottom:10px}
.lg-pass input{width:100%;padding:12px 44px 12px 14px;border:1.5px solid var(--bo);border-radius:10px;font-size:15px;font-weight:700}
.lg-pass input:focus{outline:none;border-color:var(--vd);box-shadow:0 0 0 3px rgba(58,140,63,.15)}
.lg-pass button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px 8px;font-size:16px}
.lg-err{color:var(--rd);font-weight:800;font-size:12.5px;min-height:18px;margin-bottom:8px}
.lg-or{display:flex;align-items:center;gap:10px;color:var(--tl);font-size:11px;font-weight:800;letter-spacing:.08em;margin:14px 0}
.lg-or:before,.lg-or:after{content:'';flex:1;height:1px;background:var(--bo)}
.lg-st{margin-top:14px;font-size:11.5px;color:var(--tl);font-weight:700}
.lg-st i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tl);margin-right:6px}
.lg-st.ok i{background:var(--vd)}.lg-st.wait i{background:var(--am);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ===== CABEÇALHO / ABAS ===== */
.hdr{background:#fff;border-bottom:1px solid var(--bo);display:flex;align-items:center;gap:16px;padding:8px 24px;min-height:76px}
.hdr .logo-img{height:60px;border-radius:4px;flex-shrink:0}
.hdr-mid{flex:1;text-align:center}
.hdr-mid h1{font-size:18px;font-weight:900}
.hdr-mid p{font-size:12px;color:var(--ts);font-weight:700;margin-top:2px}
.hdr-user{display:flex;align-items:center;gap:8px;min-width:150px;justify-content:flex-end}
.who{font-size:12.5px;font-weight:800;color:var(--vd2);background:var(--vdL);border-radius:20px;padding:5px 12px;white-space:nowrap}
.who.vis{color:var(--ts);background:#eee}
.tabs{background:#fff;border-bottom:1px solid var(--bo);display:flex;padding:0 20px;overflow-x:auto;position:sticky;top:0;z-index:30}
.tab{border:0;border-bottom:3px solid transparent;background:none;padding:13px 17px;font-weight:800;font-size:14px;color:var(--ts);white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--vd)}
.tab.on{color:var(--vd);border-bottom-color:var(--vd)}
.wrap{max-width:1200px;margin:0 auto;padding:22px 24px 60px}

/* ===== BOTÕES / CHIPS / CAMPOS ===== */
.btn{border:1.5px solid var(--vd);background:var(--vdL);color:var(--vd2);border-radius:20px;padding:7px 16px;font-weight:800;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--vd);color:#fff}
.btn.primary{background:var(--vd);color:#fff;border-color:var(--vd2)}.btn.primary:hover{background:var(--vd2)}
.btn.danger{border-color:#ef9a9a;background:var(--rdL);color:var(--rd)}.btn.danger:hover{background:var(--rd);color:#fff}
.btn.ghost{border-color:var(--bo);background:#fff;color:var(--ts)}.btn.ghost:hover{background:var(--bg);color:var(--tx)}
.btn.pu{border-color:#ce93d8;background:var(--puL);color:var(--pu)}.btn.pu:hover{background:var(--pu);color:#fff}
.btn.sm{padding:3px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--bo);background:#fff;color:var(--ts);border-radius:20px;padding:5px 13px;font-weight:800;font-size:13px;transition:all .12s}
.chip:hover{border-color:var(--vd);color:var(--vd)}
.chip.on{background:var(--vd);border-color:var(--vd);color:#fff}
.chip .n{opacity:.7;font-weight:700;margin-left:4px}
.chip.cur{box-shadow:inset 0 -3px 0 var(--am)}
.inp,.sel{border:1.5px solid var(--bo);background:#fff;border-radius:20px;padding:6px 13px;font-weight:700}
.inp:focus,.sel:focus,.mbody input:focus,.mbody select:focus,.mbody textarea:focus{outline:none;border-color:var(--vd)}
.lbl{font-size:11px;font-weight:800;color:var(--ts);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;display:block}
.bar-row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;margin-bottom:16px}
.grow{flex:1}
.muted{color:var(--tl);font-weight:700}
.right{margin-left:auto}

/* ===== CARDS ===== */
.card{background:var(--card);border:1px solid var(--bo);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.card-h{padding:12px 18px;border-bottom:1px solid var(--bo);display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:14.5px}
.card-b{padding:16px 18px}
.sec-t{font-size:15px;font-weight:900;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--bo);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px 14px 20px;position:relative;overflow:hidden;text-align:left;width:100%}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.kpi.click{cursor:pointer;transition:transform .15s,box-shadow .15s}
.kpi.click:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.09)}
.kpi.act{outline:2px solid var(--c)}
.kpi .k{font-size:10.5px;font-weight:800;color:var(--ts);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.kpi .v{font-size:25px;font-weight:900;color:var(--c);line-height:1.05;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--tl);font-weight:700;margin-top:4px}
.kpi .pb{height:5px;background:#eee;border-radius:3px;margin-top:9px;overflow:hidden}
.kpi .pb i{display:block;height:100%;background:var(--c);border-radius:3px;transition:width .5s}

/* ===== TABELAS ===== */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tl);padding:9px 12px;text-align:left;background:#fafaf8;border-bottom:1px solid var(--bo);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #f0f0ec;vertical-align:middle;font-size:13px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafaf8}
td.num,th.num{text-align:right}
td.c,th.c{text-align:center}
.lnk{border:0;background:none;font-weight:800;color:var(--tx);text-align:left;padding:0}
.lnk:hover{color:var(--vd);text-decoration:underline}
.av{width:30px;height:30px;border-radius:50%;background:var(--am);border:2px solid var(--am2);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0}
.av.lg{width:48px;height:48px;font-size:15px}
.av.rd{background:var(--rdL);border-color:#ef9a9a;color:var(--rd)}
.who-cell{display:flex;align-items:center;gap:10px}
.bd{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap}
.bd.pago,.bd.ok{background:var(--vdL);color:var(--vd2);border:1px solid #a5d6a7}
.bd.atrasado,.bd.er{background:var(--rdL);color:var(--rd);border:1px solid #ef9a9a}
.bd.pendente,.bd.wn{background:var(--yeL);color:#7B5800;border:1px solid #ffe082}
.bd.na,.bd.gr{background:#f1f1ee;color:var(--tl);border:1px solid #e3e3de}
.bd.bl{background:var(--blL);color:var(--bl);border:1px solid #bcd9f5}
.bd.pu{background:var(--puL);color:var(--pu);border:1px solid #ce93d8}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--vd);cursor:pointer}
.pos{color:var(--vd2);font-weight:800}.neg{color:var(--rd);font-weight:800}

/* ===== COMBO (busca de nucleado) ===== */
.combo{position:relative;min-width:260px}
.combo .inp{width:100%}
.combo-l{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--bo);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.14);max-height:300px;overflow-y:auto;z-index:40;padding:4px}
.combo-l button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-weight:700}
.combo-l button:hover,.combo-l button.on{background:var(--vdL)}
.combo-l .dot{width:8px;height:8px;border-radius:50%;background:var(--vd)}
.combo-l .dot.off{background:#ccc}
.selchip{display:inline-flex;align-items:center;gap:6px;background:var(--vd);color:#fff;border-radius:20px;padding:5px 6px 5px 13px;font-weight:800;font-size:13px}
.selchip button{border:0;background:rgba(255,255,255,.25);color:#fff;width:20px;height:20px;border-radius:50%;line-height:1;font-size:13px}

/* ===== BARRA DE SELEÇÃO ===== */
.selbar{position:sticky;top:50px;z-index:20;background:#1a1a1a;color:#fff;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.selbar .inp{width:86px;text-align:center;border-color:#555;background:#2a2a2a;color:#fff}
.selbar b{color:var(--am)}

/* ===== GRÁFICOS ===== */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:#ececE8;stroke-width:1}
.chart .ax{font-size:10px;fill:#9a9a9a;font-weight:700;font-family:inherit}
.chart .ghost{fill:#ececE8}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .55s ease both;cursor:pointer;transition:opacity .15s}
.chart .bar:hover{opacity:.78}
@keyframes grow{from{transform:scaleY(0)}}
.donut{width:100%;max-width:210px;height:auto;display:block;margin:0 auto}
.donut .slice{cursor:pointer;transition:opacity .15s}.donut .slice:hover{opacity:.8}
.dn-big{font-size:30px;font-weight:900;fill:#1a1a1a;font-family:inherit}
.dn-sm{font-size:11px;fill:#999;font-weight:700;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;font-weight:700;color:var(--ts);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.don-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.hb{display:flex;flex-direction:column;gap:9px}
.hb-r{display:grid;grid-template-columns:150px 1fr 96px;align-items:center;gap:10px;font-size:12.5px;font-weight:700}
.hb-r .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-r .b{height:14px;background:#f0f0ec;border-radius:7px;overflow:hidden}
.hb-r .b i{display:block;height:100%;border-radius:7px;transition:width .5s}
.hb-r .vv{text-align:right}

/* ===== MAPA DE CALOR ===== */
.heat{border-collapse:separate;border-spacing:3px;width:100%}
.heat th{background:none;border:0;padding:2px 0;text-align:center;font-size:10px}
.heat th.cur{color:var(--vd);}
.heat td{border:0;padding:0;background:none}
.heat td.nm{padding-right:10px;white-space:nowrap}
.hc{display:flex;align-items:center;justify-content:center;height:28px;border-radius:7px;font-weight:900;font-size:12px;cursor:pointer;transition:transform .1s;min-width:34px}
.hc:hover{transform:scale(1.12)}
.hc.pago{background:var(--vdL);color:var(--vd2)}
.hc.atrasado{background:var(--rdL);color:var(--rd)}
.hc.pendente{background:var(--yeL);color:var(--ye)}
.hc.na{background:#f4f4f1;color:#ccc;cursor:default}
.hc.dim{opacity:.3}

/* ===== ALERTAS ===== */
.al-l{max-height:260px;overflow-y:auto}
.al-i{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid #f3f3ef;width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
.al-i:hover{background:#fafaf8}
.al-i:last-child{border-bottom:0}
.al-i .nm{flex:1;font-weight:700}
.al-i .sb{font-size:11px;color:var(--tl);font-weight:700}
.al-i .vl{font-weight:900;color:var(--rd)}
.al-e{padding:18px;text-align:center;color:var(--tl);font-weight:700}
.al-h{padding:10px 16px;font-weight:900;font-size:13px;display:flex;gap:8px;align-items:center}
.al-h.er{background:var(--rdL);color:var(--rd)}.al-h.wn{background:var(--yeL);color:#7B5800}.al-h.ok{background:var(--vdL);color:var(--vd2)}

/* ===== FICHA (gaveta) ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:100;box-shadow:-12px 0 40px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .25s;overflow-y:auto}
.drawer.on{transform:none}
.dr-h{padding:18px 20px;border-bottom:1px solid var(--bo);display:flex;gap:14px;align-items:center;background:var(--amL);position:sticky;top:0;z-index:2}
.dr-h h2{font-size:17px;font-weight:900}
.dr-x{margin-left:auto;border:0;background:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;border:1px solid var(--bo)}
.dr-b{padding:16px 20px 40px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.mini div{background:var(--bg);border-radius:10px;padding:9px 12px}
.mini .k{font-size:10px;font-weight:800;color:var(--ts);text-transform:uppercase;letter-spacing:.06em}
.mini .v{font-size:17px;font-weight:900;margin-top:2px}
.dia-in[type=date]{width:150px}
.dia-in{width:56px;border:1.5px solid var(--bo);border-radius:8px;padding:4px 6px;text-align:center;font-weight:800}

/* ===== MODAL ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:16px;border-top:5px solid var(--am);padding:22px 24px;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.wide{max-width:560px}
.mbox h3{font-size:17px;font-weight:900;margin-bottom:12px}
.mbody p{color:var(--ts);font-weight:600;margin-bottom:10px}
.mbody label{display:block;font-size:11px;font-weight:800;color:var(--ts);letter-spacing:.06em;text-transform:uppercase;margin:10px 0 4px}
.mbody input,.mbody select,.mbody textarea{width:100%;border:1.5px solid var(--bo);border-radius:9px;padding:9px 12px;font-weight:700;background:#fff}
.mbody textarea{resize:vertical;min-height:52px}
.mbody .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbody .hint{font-size:12px;color:var(--tl);font-weight:700;margin-top:4px}
.mbody .err{color:var(--rd);font-weight:800;font-size:12.5px;margin-top:8px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* ===== TOAST / LOADER ===== */
#toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--vd);color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:all .25s;max-width:360px}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--rd)}.toast.warn{background:#b8860b}
.loader{position:fixed;inset:0;background:rgba(255,255,255,.94);z-index:250;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px}
.spin{width:42px;height:42px;border:4px solid #e3e3de;border-top-color:var(--vd);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== FINANCEIRO ===== */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.mm{border-radius:10px;padding:8px 6px;text-align:center;font-size:11px;font-weight:800;border:1px solid var(--bo);background:#fff;cursor:pointer}
.mm .m{font-size:11px;color:var(--ts);text-transform:uppercase;letter-spacing:.05em}
.mm .s{margin-top:3px;font-size:11.5px}
.mm.validado{background:var(--vdL);border-color:#a5d6a7;color:var(--vd2)}
.mm.conferido{background:var(--blL);border-color:#bcd9f5;color:var(--bl)}
.mm.pendente{background:var(--yeL);border-color:#ffe082;color:#7B5800}
.mm.divergente,.mm.alterado{background:var(--rdL);border-color:#ef9a9a;color:var(--rd)}
.mm.futuro{background:#f7f7f4;color:var(--tl);cursor:default}
.banner{border-radius:12px;padding:11px 16px;font-weight:700;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.wn{background:var(--yeL);border:1px solid #ffe082;color:#7B5800}
.banner.er{background:var(--rdL);border:1px solid #ef9a9a;color:var(--rd)}
.ev-card{padding:14px 18px;border-bottom:1px solid #f0f0ec}
.ev-card:last-child{border-bottom:0}
.ev-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ev-top h4{font-size:15px;font-weight:900}
.ev-nums{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0 8px}
.ev-nums div{font-size:11px;font-weight:800;color:var(--ts);text-transform:uppercase;letter-spacing:.05em}
.ev-nums b{display:block;font-size:16px;text-transform:none;letter-spacing:0;color:var(--tx)}
.pbar{height:8px;background:#eee;border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px;background:var(--vd)}
.pbar i.over{background:var(--rd)}

@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:700px){
  .hdr{flex-wrap:wrap;padding:8px 14px}.hdr-mid{order:3;flex-basis:100%}.hdr-user{min-width:0;margin-left:auto}
  .wrap{padding:14px 12px 60px}.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi .v{font-size:20px}
  .hb-r{grid-template-columns:100px 1fr 80px}.mini{grid-template-columns:1fr}.combo{min-width:0;width:100%}
}

</style>
</head>
<body>

<div id="login" class="login" hidden>
  <div class="lg-card">
    <img class="logo-img" alt="Núcleo de Inovação e Qualidade — ACIP">
    <h1>Sistema de Controle de Mensalidades</h1>
    <div class="sub">Núcleo de Inovação e Qualidade ACIP</div>
    <div class="lg-pass">
      <input id="lg-pass" type="password" placeholder="Senha de acesso" autocomplete="current-password">
      <button type="button" data-act="lg-eye" aria-label="Mostrar senha">👁</button>
    </div>
    <div class="lg-err" id="lg-err"></div>

/* ===== sessão ===== */
function saveSession() { try { sessionStorage.setItem('niq_sess', JSON.stringify({ perfil: S.perfil, token: S.token })); } catch (e) { /* ignora */ } }
function clearSession() { try { sessionStorage.removeItem('niq_sess'); } catch (e) { /* ignora */ } }
function loadSession() {
  try {
    const o = JSON.parse(sessionStorage.getItem('niq_sess') || 'null');
    if (o && (o.perfil === 'visitante' || ((o.perfil === 'tesoureiro' || o.perfil === 'coordenacao') && o.token))) { S.perfil = o.perfil; S.token = o.token || null; }
  } catch (e) { /* ignora */ }
}

/* ===== API ===== */
async function api(method, url, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  const r = await fetch(url, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  let j = null;
  try { j = await r.json(); } catch (e) { /* sem corpo */ }
  if (r.status === 401 && S.token) { forceLogout('Sua sessão expirou. Entre novamente.'); throw new Error('auth'); }
  if (!r.ok) { const err = new Error((j && j.error) || ('Erro ' + r.status)); err.status = r.status; throw err; }
  return j;
}
async function comRetry(fn, onWait) {
  let delay = 1500;
  for (let i = 0; i < 30; i++) {
    try { return await fn(); } catch (e) {
      if (e.message === 'auth') throw e;
      if (e.status && e.status < 500) throw e;
      if (onWait) onWait(i);
      await new Promise((res) => setTimeout(res, delay));
      delay = Math.min(delay * 1.3, 5000);
    }
  }
  throw new Error('Servidor indisponível');
}
function avisaSalvo(j) { if (j && j.saved === false) toast('Atenção: a alteração foi aceita, mas NÃO foi gravada no GitHub. Avise o tesoureiro.', 'err'); }

/* ===== membros, valores e status ===== */
function buildMembros() {
  const c = S.cfg || {};
  const lista = Array.isArray(c.lista) && c.lista.length ? c.lista : MEMBROS_PADRAO.slice();
  const ativos = Array.isArray(c.ativos) ? new Set(c.ativos) : null;
  S.membros = lista.map((nome) => ({
    nome, ativo: ativos ? ativos.has(nome) : true,
    inicio: (c.inicio || {})[nome] || null,
    inativoDesde: (c.inativoDesde || {})[nome] || null
  }));
}
function valorAno(ano) {
  const m = (S.cfg && S.cfg.mensalidades) || {};
  let v = null;
  Object.keys(m).map(Number).sort((a, b) => a - b).forEach((y) => { if (y <= ano && Number(m[y]) > 0) v = Number(m[y]); });
  return v == null ? 25 : v;
}
// valor guardado: número = dia do próprio mês de referência; texto 'AAAA-MM-DD' = pago em outra data
function rawPago(nome, ano, mes) { const x = (((S.pag || {})[ano] || {})[mes] || {})[nome]; return x || null; }
function pagoInfo(nome, ano, mes) {
  const v = rawPago(nome, ano, mes); if (!v) return null;
  const iso = typeof v === 'number' ? `${ano}-${pad(mes)}-${pad(v)}` : String(v);
  const [y, m, d] = iso.split('-').map(Number);
  return { iso, y, m, d, tarde: iso > `${ano}-${pad(mes)}-${pad(VENC_DIA)}` };
}
function normPagto(iso, ano, mes) { const [y, m, d] = iso.split('-').map(Number); return (y === ano && m === mes) ? d : iso; }
const pagoEmDe = (c) => c.pagoEm || `${c.ano}-${pad(c.mes)}-${pad(c.dia)}`;
const dataPagoHtml = (pg) => esc(fmtData(pg.iso)) + (pg.tarde ? ' <span class="bd wn" title="Pago após o vencimento (dia ' + VENC_DIA + ')">após venc.</span>' : '');
function isNA(m, ano, mes) {
  const k = key(ano, mes);
  if (m.inicio && k < key(m.inicio.ano, m.inicio.mes)) return true;
  if (m.inativoDesde) return k >= key(m.inativoDesde.ano, m.inativoDesde.mes);
  if (!m.ativo) return true;
  return false;
}
// o mês já venceu? (vence todo dia 10; depois disso, sem pagamento = atrasado)
function vencido(ano, mes) { const t = hoje(), k = key(ano, mes), tk = key(t.y, t.m); return k < tk || (k === tk && t.d > VENC_DIA); }
// pago | atrasado | pendente | na   (pagamento registrado sempre vale, mesmo para inativo)
function statusDe(m, ano, mes) {
  if (rawPago(m.nome, ano, mes)) return 'pago';
  if (isNA(m, ano, mes)) return 'na';
  return vencido(ano, mes) ? 'atrasado' : 'pendente';
}

}
function porMes(ano) {
  const o = {};
  MESES.forEach((mes) => {
    const r = { p: 0, a: 0, n: 0, e: 0 };
    S.membros.forEach((m) => { const s = statusDe(m, ano, mes); if (s === 'pago') r.p++; else if (s === 'atrasado') r.a++; else if (s === 'pendente') r.n++; });
    r.e = r.p + r.a + r.n; o[mes] = r;
  });
  return o;
}

/* ===================== GRÁFICOS (SVG puro) ===================== */
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}
function axisFmt(v) { return v >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + 'k' : String(Math.round(v)); }

function chartBars(o) {
  const W = 560, H = o.height || 230, pl = 46, pr = 10, pt = 14, pb = 28, iw = W - pl - pr, ih = H - pt - pb;
  const fmt = o.fmt || axisFmt, series = o.series, labels = o.labels, ghost = o.ghost;
  const all = [].concat(...series.map((s) => s.values.map((v) => v || 0)), (ghost || []).map((v) => v || 0));
  const max = niceMax(Math.max(...all, 1)), n = labels.length, gw = iw / n, bw = Math.min(30, (gw * 0.72) / series.length);
  let g = '';
  for (let t = 0; t <= 4; t++) {
    const y = pt + ih - ih * t / 4;
    g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl - 6}" y="${y + 3}" class="ax" text-anchor="end">${fmt(max * t / 4)}</text>`;
  }
  labels.forEach((lb, i) => {
    const cx = pl + gw * i + gw / 2;
    if (ghost) { const gh = ih * (ghost[i] || 0) / max; g += `<rect x="${(cx - bw * series.length / 2 - 3).toFixed(1)}" y="${(pt + ih - gh).toFixed(1)}" width="${bw * series.length + 6}" height="${gh.toFixed(1)}" rx="4" class="ghost"/>`; }
    series.forEach((s, si) => {
      const v = s.values[i] || 0, h = ih * v / max, x = cx - bw * series.length / 2 + bw * si;
      const tip = o.tip ? o.tip(i, s, v) : `${lb} · ${s.name}: ${fmtR(v)}`;
      g += `<rect x="${x.toFixed(1)}" y="${(pt + ih - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${Math.max(h, 0).toFixed(1)}" rx="3" fill="${s.color}" class="bar" ${o.barAttr ? o.barAttr(i, si) : ''}><title>${esc(tip)}</title></rect>`;
    });
    g += `<text x="${cx.toFixed(1)}" y="${H - 8}" class="ax" text-anchor="middle">${esc(lb)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>`;
}

function chartLines(o) {
  const W = 560, H = o.height || 230, pl = 46, pr = 14, pt = 14, pb = 28, iw = W - pl - pr, ih = H - pt - pb;
  const yFmt = o.yFmt || axisFmt, labels = o.labels, series = o.series;
  const vals = [].concat(...series.map((s) => s.values.filter((v) => v != null)));
  const max = o.yMax != null ? o.yMax : niceMax(Math.max(...vals, 1)), n = labels.length;
  const xs = (i) => pl + (n === 1 ? iw / 2 : iw * i / (n - 1)), ys = (v) => pt + ih - ih * (v / max);
  let g = '';
  for (let t = 0; t <= 4; t++) {
    const y = pt + ih - ih * t / 4;
    g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl - 6}" y="${y + 3}" class="ax" text-anchor="end">${yFmt(max * t / 4)}</text>`;
  }
  labels.forEach((lb, i) => { g += `<text x="${xs(i).toFixed(1)}" y="${H - 8}" class="ax" text-anchor="middle">${esc(lb)}</text>`; });
  series.forEach((s) => {
    const segs = []; let seg = [];
    s.values.forEach((v, i) => { if (v == null) { if (seg.length) segs.push(seg); seg = []; } else seg.push([xs(i), ys(v), i, v]); });
    if (seg.length) segs.push(seg);
    segs.forEach((sg) => {
      const d = sg.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      if (s.area && sg.length > 1) g += `<path d="${d} L${sg[sg.length - 1][0].toFixed(1)} ${pt + ih} L${sg[0][0].toFixed(1)} ${pt + ih} Z" fill="${s.color}" opacity=".12"/>`;
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" ${s.dash ? 'stroke-dasharray="6 5"' : ''} stroke-linecap="round" stroke-linejoin="round"/>`;
      if (!s.noDots) sg.forEach((p) => { g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4" fill="#fff" stroke="${s.color}" stroke-width="2"><title>${esc(o.tip ? o.tip(p[2], s, p[3]) : labels[p[2]] + ': ' + yFmt(p[3]))}</title></circle>`; });
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>`;
}

function chartDonut(o) {
  const R = 70, C = 2 * Math.PI * R, tot = o.slices.reduce((a, s) => a + s.value, 0);
  let off = 0, g = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="#eee" stroke-width="26"/>`;
  if (tot > 0) o.slices.forEach((s) => {
    if (!s.value) return;
    const len = C * s.value / tot;
    g += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${s.color}" stroke-width="26" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 100 100)" class="slice" ${s.attr || ''}><title>${esc(s.label)}: ${s.value}</title></circle>`;
    off += len;
  });
  g += `<text x="100" y="${o.small ? 100 : 108}" text-anchor="middle" class="dn-big">${esc(o.big)}</text>`;
  if (o.small) g += `<text x="100" y="120" text-anchor="middle" class="dn-sm">${esc(o.small)}</text>`;
  return `<svg viewBox="0 0 200 200" class="donut">${g}</svg>`;
}

function hbars(rows, fmt) { // rows: [{label,value,color,tip}]
  const max = Math.max(...rows.map((r) => Math.abs(r.value)), 1);
  return `<div class="hb">${rows.map((r) => `<div class="hb-r" title="${esc(r.tip || '')}"><span class="t">${esc(r.label)}</span><span class="b"><i style="width:${(Math.abs(r.value) / max * 100).toFixed(1)}%;background:${r.color}"></i></span><span class="vv">${fmt(r.value)}</span></div>`).join('')}</div>`;
}
const legend = (items) => `<div class="legend">${items.map((i) => `<span><i style="background:${i.color}"></i>${esc(i.label)}</span>`).join('')}</div>`;

function animateNums() {
  $$('.cnt').forEach((el) => {
    const k = el.dataset.k, to = parseFloat(el.dataset.v), f = el.dataset.f, from = S.prevNums[k];
    S.prevNums[k] = to;
    const fmt = (v) => f === 'r' ? fmtR(v) : f === 'p' ? Math.round(v) + '%' : String(Math.round(v));
    el.textContent = fmt(to);
    if (from == null || from === to || typeof requestAnimationFrame !== 'function') return;
    const t0 = performance.now(), dur = 450;
    const step = (now) => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(from + (to - from) * e);
      if (p < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = fmt(to);
    };
    requestAnimationFrame(step);
  });
}

/* ===================== DASHBOARD ===================== */
const rangeMeses = () => { const d = S.dash; return MESES.filter((m) => m >= Math.min(d.a, d.b) && m <= Math.max(d.a, d.b)); };
function trimestreAtual() { const t = hoje(), q = Math.floor((t.m - 1) / 3); return [Math.max(2, q * 3 + 1), q * 3 + 3]; }

function dashData() {
  const ano = S.dash.ano, meses = rangeMeses(), rows = [];
  let P = 0, A = 0, N = 0, PV = 0;
  S.membros.forEach((m) => {
    let p = 0, a = 0, n = 0; const atr = [];
    meses.forEach((mes) => { const s = statusDe(m, ano, mes); if (s === 'pago') { p++; if (vencido(ano, mes)) PV++; } else if (s === 'atrasado') { a++; atr.push(mes); } else if (s === 'pendente') n++; });
    if (p + a + n === 0) return;
    rows.push({ m, p, a, n, atr, st: a ? 'atrasado' : n ? 'pendente' : 'pago' });
    P += p; A += a; N += n;
  });
  return { rows, P, A, N, PV, E: P + A + N };
}

function projData(ano) {
  const t = hoje(), v = valorAno(ano), pm = porMes(ano);
  let cumR = 0, cumP = 0, elapsed = 0, pagosEl = 0, vencEl = 0;
  const real = [], prev = [];
  MESES.forEach((m) => {
    cumP += pm[m].e * v; prev.push(cumP);
    if (key(ano, m) <= key(t.y, t.m)) { cumR += pm[m].p * v; real.push(cumR); elapsed++; } else real.push(null);
    if (vencido(ano, m)) { pagosEl += pm[m].p; vencEl += pm[m].p + pm[m].a; }
  });
  const taxa = vencEl ? pagosEl / vencEl : null;
  const proj = MESES.map(() => null);
  const last = real.reduce((acc, x, i) => (x != null ? i : acc), -1);
  if (elapsed > 0 && elapsed < MESES.length && taxa != null) {
    proj[last] = real[last]; let acc = real[last];
    for (let i = last + 1; i < MESES.length; i++) { const r = pm[MESES[i]]; acc += r.p * v + r.n * v * taxa; proj[i] = acc; }
  }
  const totalProj = proj.some((x) => x != null) ? proj[proj.length - 1] : (elapsed === MESES.length ? real[real.length - 1] : null);
  return { real, prev, proj, totalPrev: prev[prev.length - 1], totalProj, taxa, elapsed };
}

function renderDash() {

  const curMes = (t.y === ano && t.m >= 2 && t.m <= 12) ? t.m : 0;

  /* KPIs */

    ${kpi('abe', 'Em aberto', num('abe', aberto, 'r'), `${dd.A} em atraso`, 'var(--rd)', 'atrasado', `<div class="pb"><i style="width:${dd.E ? dd.A / dd.E * 100 : 0}%"></i></div>`)}
    ${kpi('adi', 'Adimplência', adimp == null ? '<span>—</span>' : num('adi', adimp, 'p'), 'pagos ÷ vencidos', 'var(--bl)', '', `<div class="pb"><i style="width:${adimp || 0}%"></i></div>`)}
    ${kpi('pen', 'Pendentes', num('pen', dd.N, 'i'), 'ainda no prazo', 'var(--ye)', 'pendente')}
  </div>`;

  /* alertas */
  const atrasados = dd.rows.filter((r) => r.a).sort((x, y) => y.a - x.a || x.m.nome.localeCompare(y.m.nome));
  const emDia = dd.rows.filter((r) => !r.a && r.p);
  const alAtr = atrasados.length ? atrasados.map((r) => `<button class="al-i" data-act="ficha" data-n="${esc(r.m.nome)}"><span class="av rd">${esc(initials(r.m.nome))}</span><span class="nm">${esc(r.m.nome)}<div class="sb">${r.a} ${r.a > 1 ? 'meses' : 'mês'}: ${r.atr.map((x) => MA[x]).join(', ')}</div></span><span class="vl">${fmtR(r.a * v)}</span></button>`).join('')
    : '<div class="al-e">Nenhum atraso no período 🎉</div>';
  let venc = '';
  const dentro = ANOS.includes(t.y) && t.m >= 2 && t.m <= 12;
  if (!dentro) venc = '<div class="al-e">Fora do período de cobrança (fev–dez).</div>';

  const alertas = `<div class="grid3">

  </div>`;

/* ===================== NUCLEADOS ===================== */
function nucRows(statusOverride) {
  const n = S.nuc, rows = [];
  const filtroSt = statusOverride || n.status;
  const meses = n.mes ? [n.mes] : MESES;
  S.membros.forEach((m) => {
    if (n.nome && m.nome !== n.nome) return;
    meses.forEach((mes) => {
      const st = statusDe(m, n.ano, mes);
      if (st === 'na') return;
      if (filtroSt !== 'todos' && st !== filtroSt) return;
      rows.push({ k: `${n.ano}|${mes}|${m.nome}`, m, ano: n.ano, mes, st, pg: pagoInfo(m.nome, n.ano, mes) });
    });
  });
  rows.sort((a, b) => a.m.nome.localeCompare(b.m.nome) || a.mes - b.mes);
  return rows;
}

      ${pode ? `<td class="c">${r.pg ? `<button class="btn pu sm" data-act="comp-gerar" data-n="${esc(r.m.nome)}" data-y="${r.ano}" data-m="${r.mes}" title="Gerar comprovante">🧾</button>` : ''}</td>` : ''}</tr>`).join('') || `<tr><td colspan="7" class="al-e">Nenhum registro com esses filtros.</td></tr>`}

async function aplicarBulk(remover) {
  const n = S.nuc;
  let dia = null, iso = '';
  if (!remover && n.modo === 'dia') {
    dia = parseInt(val('bulk-dia'), 10);
    if (!(dia >= 1 && dia <= 31)) { toast('Informe o dia do pagamento (1 a 31).', 'warn'); const i = $('#bulk-dia'); if (i) i.focus(); return; }
  } else if (!remover) {
    iso = val('bulk-data');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) { toast('Informe a data do pagamento.', 'warn'); const i = $('#bulk-data'); if (i) i.focus(); return; }
  } else if (!(await confirmBox('Remover pagamentos', `Remover o pagamento de ${n.sel.size} registro(s)?`, 'Remover', true))) return;
  const regs = []; n.sel.forEach((r) => regs.push({ ano: r.ano, mes: r.mes, nome: r.m.nome, dia: iso ? normPagto(iso, r.ano, r.mes) : dia }));
  const ok = await salvarPagamentos(regs);
  if (ok) { toast(remover ? 'Pagamentos removidos.' : `${regs.length} pagamento(s) registrado(s)!`); n.sel.clear(); }
  renderCurrent();
}

async function salvarPagamentos(regs) {
  regs.forEach((r) => {
    const A = (S.pag[r.ano] = S.pag[r.ano] || {}), M = (A[r.mes] = A[r.mes] || {});
    if (r.dia) M[r.nome] = r.dia; else delete M[r.nome];
  });
  try { const j = await api('POST', '/api/pagamentos/bulk', { registros: regs }); avisaSalvo(j); return true; } catch (e) {
    if (e.message !== 'auth') { toast('Erro ao salvar: ' + e.message, 'err'); await reloadData(); }
    return false;
  }
}

/* ===================== FINANCEIRO ===================== */
const CONTA_NOME = { conta: 'Conta corrente', aplicacao: 'Aplicação' };
let LED = [];

function finMeses(ano) {
  const ab = S.fin.abertura, y = +ab.data.slice(0, 4), m = +ab.data.slice(5, 7);
  if (ano < y) return [];
  const r = []; for (let i = ano === y ? m : 1; i <= 12; i++) r.push(i);
  return r;
}
// mensalidades pagas entram como receita; quem pagou antecipado entra na data em que o dinheiro chegou
function receitasAuto() {
  const out = [], ant = (S.fin && S.fin.antecipacoes) || [];
  Object.keys(S.pag).forEach((ano) => Object.keys(S.pag[ano] || {}).forEach((mes) => Object.entries(S.pag[ano][mes] || {}).forEach(([nome, dia]) => {
    if (!dia) return;
    const a = ant.find((x) => x.nome === nome && x.ano === +ano && +mes >= x.de && +mes <= x.ate);
    const data = a ? a.recebidoEm : (typeof dia === 'number' ? `${ano}-${pad(+mes)}-${pad(dia)}` : String(dia));
    out.push({ data, tipo: 'entrada', conta: 'conta', cat: 'Mensalidades', valor: cents(valorAno(+ano)), auto: true, nome, ano: +ano, mes: +mes });
  })));
  return out;
}
function ledger() { return S.fin.movimentos.map((m) => ({ ...m, valor: cents(m.valor), cat: m.categoria })).concat(receitasAuto()); }

function saldoEm(lim) {
  const ab = S.fin.abertura; let c = cents(ab.conta), p = cents(ab.aplicacao);
  LED.forEach((e) => {
    if (e.data < ab.data || e.data > lim) return;
    const add = (conta, x) => { if (conta === 'conta') c += x; else p += x; };
    if (e.tipo === 'entrada') add(e.conta, e.valor); else if (e.tipo === 'saida') add(e.conta, -e.valor); else { add(e.conta, -e.valor); add(e.contaDestino, e.valor); }
  });
  return { conta: c, aplicacao: p, total: c + p };
}
function extStatus(ym) {
  const e = S.fin.extratos[ym], calc = saldoEm(ym + '-31'), t = hoje(), cur = `${t.y}-${pad(t.m)}`;
  if (!e || e.conta == null || e.aplicacao == null) return { st: ym > cur ? 'futuro' : 'pendente', calc, e };
  const dc = cents(e.conta) - calc.conta, dp = cents(e.aplicacao) - calc.aplicacao;
  if (e.validado) {
    const mudou = e.calcConta != null && (cents(e.calcConta) !== calc.conta || cents(e.calcAplic) !== calc.aplicacao);
    return { st: mudou ? 'alterado' : 'validado', calc, e, dc, dp };
  }
  return { st: dc === 0 && dp === 0 ? 'conferido' : 'divergente', calc, e, dc, dp };
}
const ST_TXT = { validado: '✓ Validado', conferido: 'Conferido', pendente: 'Pendente', divergente: 'Divergente', alterado: 'Alterado', futuro: '—' };
const mesFechado = (data) => !!(S.fin.extratos[data.slice(0, 7)] && S.fin.extratos[data.slice(0, 7)].validado);

function fluxoAno(ano) {
  const meses = finMeses(ano), ent = [], sai = [], saldo = [], t = hoje(), cur = `${t.y}-${pad(t.m)}`;
  meses.forEach((m) => {
    const ym = `${ano}-${pad(m)}`; let e = 0, s = 0;
    LED.forEach((x) => { if (x.data.slice(0, 7) !== ym || x.data < S.fin.abertura.data) return; if (x.tipo === 'entrada') e += x.valor; else if (x.tipo === 'saida') s += x.valor; });
    ent.push(e / 100); sai.push(s / 100); saldo.push(ym > cur ? null : saldoEm(ym + '-31').total / 100);
  });
  return { meses, ent, sai, saldo };
}
function eventoStats(id) {
  let r = 0, c = 0;
  S.fin.movimentos.forEach((m) => { if (m.eventoId !== id) return; if (m.tipo === 'entrada') r += cents(m.valor); else if (m.tipo === 'saida') c += cents(m.valor); });
  return { r: r / 100, c: c / 100, res: (r - c) / 100 };
}

/* ---------- Resumo ---------- */
function finResumo() {
  const u = S.finUi, ano = u.ano, t = hoje(), fl = fluxoAno(ano);
  const sa = saldoEm(t.iso), totE = fl.ent.reduce((a, b) => a + b, 0), totS = fl.sai.reduce((a, b) => a + b, 0);
  const kpi = (k, l, v, s, c) => `<div class="kpi" style="--c:${c}"><div class="k">${l}</div><div class="v"><span class="cnt" data-k="${k}" data-v="${v}" data-f="r">…</span></div><div class="s">${s}</div></div>`;
  const kpis = `<div class="kpis" style="grid-template-columns:repeat(4,1fr)">
    ${kpi('fc', 'Conta corrente', sa.conta / 100, 'saldo calculado hoje', 'var(--vd)')}${kpi('fa', 'Aplicação', sa.aplicacao / 100, 'saldo calculado hoje', 'var(--bl)')}
    ${kpi('ft', 'Saldo total', sa.total / 100, 'conta + aplicação', 'var(--pu)')}${kpi('fr', `Resultado ${ano}`, totE - totS, `${fmtR(totE)} entradas − ${fmtR(totS)} saídas`, totE - totS >= 0 ? 'var(--vd)' : 'var(--rd)')}</div>`;
  if (!fl.meses.length) return kpis + '<div class="al-e">Este ano é anterior ao saldo de abertura.</div>';

  const meses = fl.meses.map((m) => ({ m, ym: `${ano}-${pad(m)}`, x: extStatus(`${ano}-${pad(m)}`) }));
  const pend = meses.filter((x) => ['pendente', 'divergente', 'conferido', 'alterado'].includes(x.x.st) && x.ym < `${t.y}-${pad(t.m)}`);
  const strip = `<div class="card"><div class="card-h">✅ Validação dos extratos — ${ano} ${pend.length ? `<span class="bd er">${pend.length} mês(es) aguardando validação</span>` : '<span class="bd ok">em dia</span>'}</div><div class="card-b"><div class="strip">
    ${meses.map((x) => `<div class="mm ${x.x.st}" ${x.x.st !== 'futuro' ? 'data-act="fin-sub" data-s="conc"' : ''} title="${MN[x.m]}: ${ST_TXT[x.x.st]}"><div class="m">${MA[x.m]}</div><div class="s">${ST_TXT[x.x.st]}</div></div>`).join('')}</div></div></div>`;

  const labels = fl.meses.map((m) => MA[m]);
  const c1 = chartBars({ labels, series: [{ name: 'Entradas', color: '#3A8C3F', values: fl.ent }, { name: 'Saídas', color: '#d32f2f', values: fl.sai }], tip: (i, s, v) => `${MN[fl.meses[i]]} · ${s.name}: ${fmtR(v)}` }) + legend([{ label: 'Entradas', color: '#3A8C3F' }, { label: 'Saídas', color: '#d32f2f' }]);
  const c2 = chartLines({ labels, series: [{ name: 'Saldo total', color: '#6a1b9a', values: fl.saldo, area: true }], tip: (i, s, v) => `${MN[fl.meses[i]]}: ${fmtR(v)}` });
  const cat = {}; LED.forEach((x) => { if (x.tipo === 'saida' && x.data.slice(0, 4) === String(ano) && x.data >= S.fin.abertura.data) cat[x.cat] = (cat[x.cat] || 0) + x.valor / 100; });
  const catRows = Object.entries(cat).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: k, value: v, color: '#d32f2f' }));
  const evs = S.fin.eventos.filter((e) => !e.data || e.data.slice(0, 4) === String(ano)).map((e) => ({ e, s: eventoStats(e.id) }));
  const evRows = evs.map((x) => ({ label: x.e.nome, value: x.s.res, color: x.s.res >= 0 ? '#3A8C3F' : '#d32f2f', tip: `Receitas ${fmtR(x.s.r)} · Custos ${fmtR(x.s.c)}` }));
  const grid = `<div class="grid2">
    <div class="card"><div class="card-h">📊 Entradas × saídas por mês</div><div class="card-b">${c1}</div></div>
    <div class="card"><div class="card-h">📈 Evolução do saldo total</div><div class="card-b">${c2}</div></div>
    <div class="card"><div class="card-h">🧾 Gastos por categoria</div><div class="card-b">${catRows.length ? hbars(catRows, fmtR) : '<div class="al-e">Nenhuma saída lançada neste ano.</div>'}</div></div>
    <div class="card"><div class="card-h">🎪 Resultado por evento</div><div class="card-b">${evRows.length ? hbars(evRows, (v) => (v >= 0 ? '+' : '−') + fmtR(Math.abs(v))) : '<div class="al-e">Nenhum evento cadastrado.</div>'}</div></div></div>`;
  return kpis + strip + grid;
}

/* ---------- Movimentações ---------- */
function finMov() {
  const u = S.finUi, ano = u.ano, meses = finMeses(ano), q = norm(u.q);
  const cats = ['Mensalidades', 'Transferência'].concat(S.fin.categorias);
  // filtro que não existe mais nas opções seria invisível na tela: zera
  if (u.mFiltro && !meses.includes(u.mFiltro)) u.mFiltro = 0;
  if (u.cat && !cats.includes(u.cat)) u.cat = '';
  if (u.evento && !S.fin.eventos.some((e) => e.id === u.evento)) u.evento = '';
  const filtrosAtivos = !!(u.mFiltro || u.cat || u.evento || u.tipo || u.conta || u.q);
  const outros = {}; S.fin.movimentos.forEach((m) => { const y = m.data.slice(0, 4); if (y !== String(ano)) outros[y] = (outros[y] || 0) + 1; });
  let rows = LED.filter((x) => !x.auto && x.data.slice(0, 4) === String(ano)).map((x) => ({ ...x }));
  if (u.auto) { // mensalidades agrupadas por mês de recebimento
    const g = {};
    LED.filter((x) => x.auto && x.data.slice(0, 4) === String(ano) && x.data >= S.fin.abertura.data).forEach((x) => { const ym = x.data.slice(0, 7); (g[ym] = g[ym] || { data: x.data, valor: 0, n: 0 }); g[ym].valor += x.valor; g[ym].n++; if (x.data > g[ym].data) g[ym].data = x.data; });
    Object.entries(g).forEach(([ym, o]) => rows.push({ id: 'auto-' + ym, data: o.data, tipo: 'entrada', conta: 'conta', cat: 'Mensalidades', categoria: 'Mensalidades', valor: o.valor, descricao: `Mensalidades recebidas (${o.n} pagamento${o.n > 1 ? 's' : ''})`, auto: true }));
  }
  rows = rows.filter((x) => (!u.mFiltro || +x.data.slice(5, 7) === u.mFiltro) && (!u.cat || (x.cat || x.categoria) === u.cat) && (!u.evento || x.eventoId === u.evento) && (!u.tipo || x.tipo === u.tipo) && (!u.conta || x.conta === u.conta) && (!q || norm(x.descricao).includes(q)));
  rows.sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : 0));
  let e = 0, s = 0; rows.forEach((x) => { if (x.tipo === 'entrada') e += x.valor; else if (x.tipo === 'saida') s += x.valor; });
  const evNome = (id) => { const x = S.fin.eventos.find((z) => z.id === id); return x ? x.nome : ''; };
  const sel = (id, chg, opts) => `<select class="sel" id="${id}" data-chg="${chg}">${opts}</select>`;
  const filtros = `<div class="card"><div class="card-b"><div class="bar-row" style="margin-bottom:0">
    <div><span class="lbl">Mês</span>${sel('m-mes', 'mov-f-mes', `<option value="0">Todos</option>${meses.map((m) => `<option value="${m}" ${u.mFiltro === m ? 'selected' : ''}>${MN[m]}</option>`).join('')}`)}</div>
    <div><span class="lbl">Categoria</span>${sel('m-cat', 'mov-f-cat', `<option value="">Todas</option>${cats.map((c) => `<option ${u.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}`)}</div>
    <div><span class="lbl">Evento</span>${sel('m-evt', 'mov-f-evento', `<option value="">Todos</option>${S.fin.eventos.map((x) => `<option value="${x.id}" ${u.evento === x.id ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}`)}</div>
    <div><span class="lbl">Tipo</span>${sel('m-tipo', 'mov-f-tipo', `<option value="">Todos</option><option value="entrada" ${u.tipo === 'entrada' ? 'selected' : ''}>Entrada</option><option value="saida" ${u.tipo === 'saida' ? 'selected' : ''}>Saída</option><option value="transferencia" ${u.tipo === 'transferencia' ? 'selected' : ''}>Transferência</option>`)}</div>
    <div><span class="lbl">Conta</span>${sel('m-conta', 'mov-f-conta', `<option value="">Todas</option><option value="conta" ${u.conta === 'conta' ? 'selected' : ''}>Conta corrente</option><option value="aplicacao" ${u.conta === 'aplicacao' ? 'selected' : ''}>Aplicação</option>`)}</div>
    <div class="grow"><span class="lbl">Buscar</span><input class="inp" id="m-q" placeholder="🔎 descrição…" value="${esc(u.q)}" data-inp="mov-q" style="width:100%"></div>
    <label style="display:flex;gap:6px;align-items:center;font-weight:700"><input type="checkbox" data-chg="mov-auto" ${u.auto ? 'checked' : ''}> incluir mensalidades</label>
    ${filtrosAtivos ? '<button class="btn ghost" data-act="mov-limpar">✕ Limpar filtros</button>' : ''}
    <button class="btn primary" data-act="mov-new">+ Novo lançamento</button></div></div></div>`;
  const dicaAnos = Object.keys(outros).length ? `<div class="banner wn" style="margin-bottom:10px">📅 Há lançamentos em outros anos: ${Object.keys(outros).sort().map((y) => `<button class="chip" data-act="fin-goano" data-y="${y}">${y} <span class="n">(${outros[y]})</span></button>`).join(' ')}</div>` : '';
  const tot = `<div class="muted" style="margin:2px 2px 10px">${rows.length} lançamento(s) · entradas <b class="pos">${fmtR(e / 100)}</b> · saídas <b class="neg">${fmtR(s / 100)}</b> · líquido <b>${fmtR((e - s) / 100)}</b></div>`;
  const tabela = `<div class="card"><div class="tw"><table><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Evento</th><th>Conta</th><th class="num">Valor</th><th class="c">Ações</th></tr></thead><tbody>
    ${rows.map((x) => {
      const t = x.tipo === 'entrada' ? '<span class="bd ok">Entrada</span>' : x.tipo === 'saida' ? '<span class="bd er">Saída</span>' : '<span class="bd bl">Transferência</span>';
      const v = x.tipo === 'entrada' ? `<span class="pos">+ ${fmtR(x.valor / 100)}</span>` : x.tipo === 'saida' ? `<span class="neg">− ${fmtR(x.valor / 100)}</span>` : `<b>${fmtR(x.valor / 100)}</b>`;
      const contaTxt = x.tipo === 'transferencia' ? `${CONTA_NOME[x.conta]} → ${CONTA_NOME[x.contaDestino]}` : CONTA_NOME[x.conta];
      const acoes = x.auto ? '<span class="bd gr">automático</span>' : mesFechado(x.data) ? '<span title="Mês validado — reabra para alterar">🔒</span>' : `<span style="display:inline-flex;gap:4px"><button class="btn sm" data-act="mov-edit" data-id="${esc(x.id)}">✏️</button><button class="btn danger sm" data-act="mov-del" data-id="${esc(x.id)}">🗑</button></span>`;
      return `<tr><td>${fmtData(x.data)}</td><td>${t}</td><td>${esc(x.cat || x.categoria)}</td><td>${esc(x.descricao)}${x.obs ? `<div class="muted" style="font-size:11px">${esc(x.obs)}</div>` : ''}</td><td>${esc(evNome(x.eventoId))}</td><td>${contaTxt}</td><td class="num">${v}</td><td class="c">${acoes}</td></tr>`;
    }).join('') || `<tr><td colspan="8" class="al-e">${filtrosAtivos ? 'Nenhum lançamento com esses filtros.' : Object.keys(outros).length ? `Nenhum lançamento em ${ano}. Há lançamentos em outros anos (veja acima).` : `Nenhum lançamento em ${ano} ainda.`}</td></tr>`}
    </tbody></table></div></div>`;
  return filtros + dicaAnos + tot + tabela;
}

function modalMov(id, preset) {
  const m = id ? S.fin.movimentos.find((x) => x.id === id) : null, p = m || preset || {}, t = hoje();
  const cats = S.fin.categorias.filter((c) => c !== 'Transferência');
  openModal(m ? 'Editar lançamento' : 'Novo lançamento', `
    <label>Tipo</label><select id="mv-tipo" data-chg="mv-tipo"><option value="saida" ${p.tipo === 'saida' || !p.tipo ? 'selected' : ''}>Saída (despesa)</option><option value="entrada" ${p.tipo === 'entrada' ? 'selected' : ''}>Entrada (receita)</option><option value="transferencia" ${p.tipo === 'transferencia' ? 'selected' : ''}>Transferência entre contas</option></select>
    <div class="two"><div><label>Data</label><input type="date" id="mv-data" data-chg="mv-tipo" value="${esc(p.data || t.iso)}"></div><div><label>Valor (R$)</label><input type="number" step="0.01" min="0.01" id="mv-valor" value="${p.valor || ''}"></div></div>
    <div class="two"><div><label id="mv-conta-l">Conta</label><select id="mv-conta" data-chg="mv-tipo"><option value="conta" ${p.conta !== 'aplicacao' ? 'selected' : ''}>Conta corrente</option><option value="aplicacao" ${p.conta === 'aplicacao' ? 'selected' : ''}>Aplicação</option></select></div>
    <div id="mv-cat-w"><label>Categoria</label><select id="mv-cat" data-chg="mv-cat">${cats.map((c) => `<option ${p.categoria === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}<option value="__nova">➕ Nova categoria…</option></select><input id="mv-cat-n" placeholder="Nome da nova categoria" hidden style="margin-top:6px"></div></div>
    <div id="mv-dest" class="hint" hidden></div>
    <div id="mv-dhint" class="hint" style="color:#b8860b" hidden></div>
    <div id="mv-evt-w"><label>Evento (opcional)</label><select id="mv-evt"><option value="">— nenhum —</option>${S.fin.eventos.map((e) => `<option value="${e.id}" ${p.eventoId === e.id ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select></div>
    <label>Descrição</label><input id="mv-desc" value="${esc(p.descricao || '')}" placeholder="Ex.: Coffee break da reunião de março">
    <label>Observação (opcional)</label><textarea id="mv-obs">${esc(p.obs || '')}</textarea>`,
  [{ label: 'Cancelar', cls: 'ghost' }, {
    label: 'Salvar', cls: 'primary', fn: async () => {
      const tipo = val('mv-tipo'), conta = val('mv-conta'), valor = parseFloat(val('mv-valor')), data = val('mv-data'), desc = val('mv-desc').trim();
      if (!data) { modalErr('Informe a data.'); return false; }
      if (+data.slice(0, 4) < 2020 || +data.slice(0, 4) > 2100) { modalErr('Confira o ano da data: ' + data.slice(0, 4)); return false; }
      if (!(valor > 0)) { modalErr('Informe um valor maior que zero.'); return false; }
      if (!desc) { modalErr('Informe a descrição.'); return false; }
      let categoria = val('mv-cat'); if (categoria === '__nova') categoria = val('mv-cat-n').trim();
      if (tipo !== 'transferencia' && !categoria) { modalErr('Informe a categoria.'); return false; }
      const mov = { id: m ? m.id : uid(), data, tipo, conta, valor, categoria, descricao: desc, eventoId: tipo === 'transferencia' ? null : (val('mv-evt') || null), obs: val('mv-obs') };
      if (tipo === 'transferencia') mov.contaDestino = conta === 'conta' ? 'aplicacao' : 'conta';
      if (!(await finOp({ op: 'mov.save', mov }))) return false;
      // leva a tela para o ano do lançamento e limpa filtros, para ele aparecer na lista
      Object.assign(S.finUi, { ano: +data.slice(0, 4), mFiltro: 0, cat: '', evento: '', tipo: '', conta: '', q: '' });
      toast('Lançamento salvo em ' + fmtData(data) + '.'); renderCurrent();
    }
  }], { wide: true });
  mvToggle();
}
function mvToggle() {
  const tr = val('mv-tipo') === 'transferencia', conta = val('mv-conta');
  const set = (id, hide) => { const e = document.getElementById(id); if (e) e.hidden = hide; };
  set('mv-cat-w', tr); set('mv-evt-w', tr);
  const lb = document.getElementById('mv-conta-l'); if (lb) lb.textContent = tr ? 'De' : 'Conta';
  const d = document.getElementById('mv-dest'); if (d) { d.hidden = !tr; d.textContent = tr ? `→ para: ${CONTA_NOME[conta === 'conta' ? 'aplicacao' : 'conta']}. ${conta === 'conta' ? 'Isto é um aporte na aplicação.' : 'Isto é um resgate da aplicação.'} Não conta como receita nem despesa.` : ''; }
  const cs = document.getElementById('mv-cat'), cn = document.getElementById('mv-cat-n'); if (cs && cn) cn.hidden = cs.value !== '__nova';
  const dh = document.getElementById('mv-dhint'), dv = val('mv-data');
  if (dh) {
    let msg = '';
    if (dv && (+dv.slice(0, 4) < 2020 || +dv.slice(0, 4) > 2100)) msg = '⚠ Confira o ano: ' + dv.slice(0, 4);
    else if (dv && dv < S.fin.abertura.data) msg = `⚠ Data anterior ao saldo de abertura (${fmtData(S.fin.abertura.data)}): o lançamento aparece na lista, mas não entra nos saldos.`;
    else if (dv && dv.slice(0, 4) !== String(S.finUi.ano)) msg = `Este lançamento ficará em ${dv.slice(0, 4)}. A tela vai para esse ano ao salvar.`;
    dh.textContent = msg; dh.hidden = !msg;
  }
}

/* ---------- Eventos ---------- */

}
function modalEvento(id) {

/* ---------- Conciliação ---------- */
function finConc() {
  const ano = S.finUi.ano, ab = S.fin.abertura, meses = finMeses(ano);
  const dif = (d) => d == null ? '' : d === 0 ? '<span class="pos">0,00</span>' : `<span class="neg">${d > 0 ? '+' : '−'} ${fmtR(Math.abs(d) / 100)}</span>`;
  const abert = `<div class="card"><div class="card-h">🏦 Saldos de abertura <span class="muted">saldo nas contas na data inicial do controle</span></div><div class="card-b"><div class="bar-row" style="margin-bottom:0">
    <div><span class="lbl">Data de referência</span><input class="inp" type="date" id="ab-data" value="${esc(ab.data)}" style="border-radius:9px"></div>
    <div><span class="lbl">Conta corrente (R$)</span><input class="inp" type="number" step="0.01" id="ab-conta" value="${ab.conta}" style="border-radius:9px;width:150px"></div>
    <div><span class="lbl">Aplicação (R$)</span><input class="inp" type="number" step="0.01" id="ab-aplic" value="${ab.aplicacao}" style="border-radius:9px;width:150px"></div>
    <button class="btn primary" data-act="ab-save">Salvar saldos</button></div>
    <div class="hint muted" style="margin-top:8px">Lançamentos anteriores a esta data são ignorados. Para alterar com meses já validados, reabra-os antes.</div></div></div>`;
  const linhas = meses.map((m) => {
    const ym = `${ano}-${pad(m)}`, x = extStatus(ym), e = x.e;
    const acao = x.st === 'futuro' ? '' : (x.st === 'validado' || x.st === 'alterado')
      ? `<button class="btn sm" data-act="ext-reabrir" data-ym="${ym}">🔓 Reabrir</button>`
      : `<span style="display:inline-flex;gap:4px"><button class="btn sm" data-act="ext-set" data-ym="${ym}">${e && e.conta != null ? '✏️ Extrato' : '＋ Informar extrato'}</button>${x.st === 'conferido' ? `<button class="btn primary sm" data-act="ext-validar" data-ym="${ym}">✓ Validar</button>` : ''}</span>`;
    return `<tr><td><b>${MN[m]}</b></td><td class="num">${fmtR(x.calc.conta / 100)}</td><td class="num">${e && e.conta != null ? fmtR(e.conta) : '—'}</td><td class="num">${dif(x.dc)}</td>
      <td class="num">${fmtR(x.calc.aplicacao / 100)}</td><td class="num">${e && e.aplicacao != null ? fmtR(e.aplicacao) : '—'}</td><td class="num">${dif(x.dp)}</td>
      <td><span class="bd ${x.st === 'validado' ? 'ok' : x.st === 'conferido' ? 'bl' : x.st === 'pendente' ? 'wn' : x.st === 'futuro' ? 'gr' : 'er'}">${ST_TXT[x.st]}</span>${x.st === 'alterado' ? '<div class="muted" style="font-size:11px">mudou após validar</div>' : ''}${e && e.validado ? `<div class="muted" style="font-size:11px">${esc(e.validadoPor || '')} · ${fmtData((e.validadoEm || '').slice(0, 10))}</div>` : ''}</td><td class="c">${acao}</td></tr>`;
  }).join('');
  const conc = `<div class="card"><div class="card-h">🧮 Conferência mensal com o extrato — ${ano}</div><div class="tw"><table><thead><tr><th>Mês</th><th class="num">Conta (calculado)</th><th class="num">Conta (extrato)</th><th class="num">Dif.</th><th class="num">Aplicação (calc.)</th><th class="num">Aplicação (extrato)</th><th class="num">Dif.</th><th>Situação</th><th class="c">Ações</th></tr></thead><tbody>
    ${linhas || '<tr><td colspan="9" class="al-e">Este ano é anterior ao saldo de abertura.</td></tr>'}</tbody></table></div></div>`;
  const ant = S.fin.antecipacoes;
  const antec = `<div class="card"><div class="card-h">📅 Mensalidades pagas antecipadamente <span class="muted">entram na conta na data em que o dinheiro chegou</span><button class="btn sm right" data-act="ant-add">+ Adicionar</button></div><div class="tw"><table><thead><tr><th>Nucleado</th><th>Ano</th><th>Recebido em</th><th>Meses cobertos</th><th class="c"></th></tr></thead><tbody>
    ${ant.map((a) => `<tr><td><b>${esc(a.nome)}</b></td><td>${a.ano}</td><td>${fmtData(a.recebidoEm)}</td><td>${MA[a.de]} a ${MA[a.ate]}</td><td class="c"><button class="btn danger sm" data-act="ant-del" data-id="${esc(a.id)}">🗑</button></td></tr>`).join('') || '<tr><td colspan="5" class="al-e">Nenhuma.</td></tr>'}</tbody></table></div></div>`;
  return abert + conc + antec;
}
function modalExtrato(ym) {
  const x = extStatus(ym), e = x.e || {};
  openModal(`Extrato de ${MN[+ym.slice(5)]}/${ym.slice(0, 4)}`, `<p>Informe o <b>saldo final</b> que consta no extrato do mês.</p>
    <div class="two"><div><label>Conta corrente (R$)</label><input type="number" step="0.01" id="ex-c" value="${e.conta != null ? e.conta : ''}" autofocus><div class="hint">Calculado: ${fmtR(x.calc.conta / 100)}</div></div>
    <div><label>Aplicação (R$)</label><input type="number" step="0.01" id="ex-a" value="${e.aplicacao != null ? e.aplicacao : ''}"><div class="hint">Calculado: ${fmtR(x.calc.aplicacao / 100)}</div></div></div>
    <label>Observação (opcional)</label><textarea id="ex-o">${esc(e.obs || '')}</textarea>`,
  [{ label: 'Cancelar', cls: 'ghost' }, {
    label: 'Salvar', cls: 'primary', fn: async () => {
      const c = val('ex-c'), a = val('ex-a'); if (c === '' || a === '') { modalErr('Informe os dois saldos.'); return false; }
      if (!(await finOp({ op: 'extrato.set', ym, conta: parseFloat(c), aplicacao: parseFloat(a), obs: val('ex-o') }))) return false;
      const n = extStatus(ym); toast(n.st === 'conferido' ? 'Saldos conferem! Agora é só validar.' : 'Extrato salvo — há diferença a conferir.', n.st === 'conferido' ? 'ok' : 'warn'); renderCurrent();
    }
  }]);
}
function modalAntec() {
  const t = hoje();
  openModal('Mensalidade paga antecipadamente', `<label>Nucleado</label><select id="an-n">${S.membros.map((m) => `<option>${esc(m.nome)}</option>`).join('')}</select>
    <div class="two"><div><label>Ano</label><select id="an-y">${optAno(clamp(t.y, ANOS[0], ANOS[ANOS.length - 1]))}</select></div><div><label>Dinheiro recebido em</label><input type="date" id="an-d" value="${t.iso}"></div></div>
    <div class="two"><div><label>Cobre de</label><select id="an-de">${optMes(2)}</select></div><div><label>até</label><select id="an-ate">${optMes(12)}</select></div></div>`,
  [{ label: 'Cancelar', cls: 'ghost' }, {
    label: 'Adicionar', cls: 'primary', fn: async () => {
      const de = +val('an-de'), ate = +val('an-ate'); if (de > ate) { modalErr('O mês inicial deve ser anterior ao final.'); return false; }
      const lista = S.fin.antecipacoes.concat([{ id: uid(), nome: val('an-n'), ano: +val('an-y'), recebidoEm: val('an-d'), de, ate }]);
      if (!(await finOp({ op: 'antec.set', lista }))) return false;
      toast('Antecipação adicionada.'); renderCurrent();
    }
  }]);
}

/* ===================== NAVEGAÇÃO ===================== */
function tabsDoPerfil() {
  const t = [['dash', '📊 Dashboard'], ['nuc', '👥 Nucleados']];
  if (can.fin()) t.push(['fin', '💰 Financeiro']);
  if (can.teso()) { t.push(['comp', '🧾 Comprovantes']); t.push(['teso', '🔐 Tesoureiro']); }
  return t;
}
function renderShell() {
  $('#hdr-user').innerHTML = S.perfil === 'visitante'
    ? '<span class="who vis">👁 Visitante</span><button class="btn primary sm" data-act="to-login">Entrar</button>'
    : `<span class="who">🔓 ${S.perfil === 'tesoureiro' ? 'Tesoureiro' : 'Coordenação'}</span><button class="btn ghost sm" data-act="logout">Sair</button>`;
  $('#tabs').innerHTML = tabsDoPerfil().map(([k, l]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-act="tab" data-t="${k}">${l}</button>`).join('');
}
function goTab(t) {
  if (!tabsDoPerfil().some(([k]) => k === t)) t = 'dash';
  S.tab = t; renderShell(); renderCurrent(); window.scrollTo(0, 0);
}
function keepFocus(fn) {
  const a = document.activeElement, id = a && a.id, s = a && a.selectionStart, e = a && a.selectionEnd;
  fn();
  if (id) { const n = document.getElementById(id); if (n && n !== document.activeElement) { n.focus(); try { if (s != null) n.setSelectionRange(s, e); } catch (_) { /* tipo sem seleção */ } } }
}
function renderCurrent() {
  if (!S.perfil) return;
  keepFocus(() => ({ dash: renderDash, nuc: renderNuc, fin: renderFin, comp: renderComp, teso: renderTeso }[S.tab] || renderDash)());
  if (S.ficha) renderFicha();
}

/* ===================== AÇÕES (clique) ===================== */
const ACTS = {
  'tab': (el) => goTab(el.dataset.t),
  'logout': () => logout(),
  'to-login': () => forceLogout(''),
  'reload': () => enterApp(),
  'refresh': async (el) => { await reloadData(); toast('Dados atualizados.'); },
  'lg-go': () => doLogin(),
  'lg-visit': () => doVisitante(),
  'lg-eye': () => { const i = $('#lg-pass'); i.type = i.type === 'password' ? 'text' : 'password'; },
  'modal-btn': async (el) => {
    const b = S.modalBtns && S.modalBtns[+el.dataset.i]; if (!b) return;
    if (b.fn) { const r = await b.fn(); if (r === false) return; }
    closeModal();
  },

  /* dashboard */
  'dash-range': (el) => { S.dash.a = +el.dataset.a; S.dash.b = +el.dataset.b; renderCurrent(); },
  'dash-tri': () => { const t = hoje(); const [a, b] = trimestreAtual(); S.dash.ano = clamp(t.y, ANOS[0], ANOS[ANOS.length - 1]); S.dash.a = a; S.dash.b = b; renderCurrent(); },
  'dash-compare': () => { S.dash.compare = !S.dash.compare; renderCurrent(); },
  'dash-status': (el) => { S.dash.status = S.dash.status === el.dataset.st ? 'todos' : el.dataset.st; renderCurrent(); },
  'ficha': (el) => openFicha(el.dataset.n, S.tab === 'nuc' ? S.nuc.ano : S.dash.ano),
  'ficha-x': () => closeFicha(),
  'ficha-ano': (el) => { S.ficha.ano = +el.dataset.y; renderFicha(); },
  'fd-save': async (el) => {
    const row = el.closest('tr'), iso = row.querySelector('.dia-in').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) { toast('Informe a data do pagamento.', 'warn'); return; }
    if (await salvarPagamentos([{ ano: +row.dataset.y, mes: +row.dataset.m, nome: el.dataset.n, dia: normPagto(iso, +row.dataset.y, +row.dataset.m) }])) toast('Pagamento registrado.');
    renderCurrent();
  },
  'fd-del': async (el) => {
    const row = el.closest('tr');
    if (await salvarPagamentos([{ ano: +row.dataset.y, mes: +row.dataset.m, nome: el.dataset.n, dia: null }])) toast('Pagamento removido.');
    renderCurrent();
  },

  /* nucleados */
  'nuc-ano': (el) => { S.nuc.ano = +el.dataset.y; S.nuc.sel.clear(); renderCurrent(); },
  'nuc-mes': (el) => { S.nuc.mes = +el.dataset.m; S.nuc.sel.clear(); renderCurrent(); },
  'nuc-status': (el) => { S.nuc.status = el.dataset.st; S.nuc.sel.clear(); renderCurrent(); },
  'nuc-pick': (el) => { S.nuc.nome = el.dataset.n; S.nuc.q = ''; S.nuc.open = false; S.nuc.sel.clear(); renderCurrent(); },
  'sel-row': (el) => { const r = nucRows().find((x) => x.k === el.dataset.k); if (!r) return; if (el.checked) S.nuc.sel.set(r.k, r); else S.nuc.sel.delete(r.k); renderCurrent(); },
  'sel-all': (el) => { const rows = nucRows(); if (el.checked) rows.forEach((r) => S.nuc.sel.set(r.k, r)); else rows.forEach((r) => S.nuc.sel.delete(r.k)); renderCurrent(); },
  'bulk-reg': () => aplicarBulk(false),
  'bulk-rem': () => aplicarBulk(true),
  'bulk-clear': () => { S.nuc.sel.clear(); renderCurrent(); },

  /* comprovantes */
  'comp-gerar': (el) => gerarComprovante(el.dataset.n, +el.dataset.y, +el.dataset.m),
  'comp-baixar': async (el) => { const c = S.comps[+el.dataset.i]; if (c) baixarCanvas(await desenharComprovante({ ...c, validador: (S.cfg && S.cfg.tesoureiroNome) || 'Tesoureiro' }), c.nome, c.mes, c.ano); },
  'comp-clear': async () => {
    if (!(await confirmBox('Limpar histórico', 'Apagar todo o histórico de comprovantes gerados? Os pagamentos não são afetados.', 'Apagar', true))) return;
    try { await api('DELETE', '/api/comprovantes'); S.comps = []; renderCurrent(); toast('Histórico apagado.'); } catch (e) { if (e.message !== 'auth') toast(e.message, 'err'); }
  },

  /* tesoureiro */
  'teso-save-valores': async () => {
    const m = {}; ANOS.forEach((y) => { const v = parseFloat(val('mv-' + y)); if (v > 0) m[y] = v; });
    if (!Object.keys(m).length) { toast('Informe ao menos um valor.', 'warn'); return; }
    const atual = (S.cfg.mensalidades || {})[2026];
    if (atual != null && m[2026] !== atual && !(await confirmBox('Alterar valor de 2026', 'Isso recalcula o arrecadado e o valor em aberto de 2026 e o financeiro. Tem certeza?', 'Alterar', true))) return;
    if (await salvarConfig({ mensalidades: m })) toast('Valores salvos.'); renderCurrent();
  },
  'teso-save-nome': async () => { const n = val('teso-nome').trim(); if (!n) { toast('Informe o nome.', 'warn'); return; } if (await salvarConfig({ tesoureiroNome: n })) toast('Nome salvo.'); renderCurrent(); },
  'nuc-add': () => modalNucleado(null),
  'nuc-edit': (el) => modalNucleado(el.dataset.n),
  'nuc-inativar': (el) => modalInativar(el.dataset.n),
  'nuc-reativar': async (el) => { const m = membroPor(el.dataset.n); m.ativo = true; m.inativoDesde = null; if (await salvarConfig(cfgMembros())) toast('Nucleado reativado.'); renderCurrent(); },
  'backup': async () => {
    try {
      const r = await fetch('/api/backup', { headers: { Authorization: 'Bearer ' + S.token } });
      if (!r.ok) throw new Error('Erro ' + r.status);
      const blob = await r.blob(), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `niq-backup-${hoje().iso}.json`; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast('Não foi possível baixar o backup: ' + e.message, 'err'); }
  },

  /* financeiro */
  'fin-sub': (el) => { S.finUi.sub = el.dataset.s; renderCurrent(); window.scrollTo(0, 0); },
  'mov-new': () => modalMov(null),
  'mov-limpar': () => { Object.assign(S.finUi, { mFiltro: 0, cat: '', evento: '', tipo: '', conta: '', q: '' }); renderCurrent(); },
  'fin-goano': (el) => { Object.assign(S.finUi, { ano: +el.dataset.y, mFiltro: 0 }); renderCurrent(); },
  'mov-edit': (el) => modalMov(el.dataset.id),
  'mov-del': async (el) => { if (await confirmBox('Excluir lançamento', 'Excluir este lançamento definitivamente?', 'Excluir', true)) { if (await finOp({ op: 'mov.del', id: el.dataset.id })) toast('Lançamento excluído.'); renderCurrent(); } },
  'evt-new': () => modalEvento(null),
  'evt-edit': (el) => modalEvento(el.dataset.id),
  'evt-del': async (el) => { if (await confirmBox('Excluir evento', 'Excluir este evento?', 'Excluir', true)) { if (await finOp({ op: 'evt.del', id: el.dataset.id })) toast('Evento excluído.'); renderCurrent(); } },
  'evt-lanc': (el) => modalMov(null, { tipo: 'saida', categoria: 'Evento', eventoId: el.dataset.id }),
  'evt-ver': (el) => { Object.assign(S.finUi, { sub: 'mov', evento: el.dataset.id, mFiltro: 0, cat: '', tipo: '', conta: '', q: '' }); renderCurrent(); },
  'ab-save': async () => { if (await finOp({ op: 'abertura.set', abertura: { data: val('ab-data'), conta: parseFloat(val('ab-conta')) || 0, aplicacao: parseFloat(val('ab-aplic')) || 0 } })) toast('Saldos de abertura salvos.'); renderCurrent(); },
  'ext-set': (el) => modalExtrato(el.dataset.ym),
  'ext-validar': async (el) => {
    const ym = el.dataset.ym, x = extStatus(ym);
    if (!(await confirmBox('Validar extrato', `Confirmar que o extrato de ${MN[+ym.slice(5)]}/${ym.slice(0, 4)} confere com o sistema? O mês ficará fechado para novos lançamentos.`, 'Validar'))) return;
    if (await finOp({ op: 'extrato.validar', ym, calcConta: x.calc.conta / 100, calcAplic: x.calc.aplicacao / 100 })) toast('Mês validado ✓');
    renderCurrent();
  },
  'ext-reabrir': (el) => {
    const ym = el.dataset.ym;
    openModal('Reabrir mês', '<p>Digite a sua senha de acesso para reabrir este mês para alterações.</p><label>Senha</label><input type="password" id="ro-s" autofocus>', [{ label: 'Cancelar', cls: 'ghost' }, {
      label: 'Reabrir', cls: 'danger', fn: async () => { if (!(await finOp({ op: 'extrato.reabrir', ym, senha: val('ro-s') }))) return false; toast('Mês reaberto.'); renderCurrent(); }
    }]);
  },
  'ant-add': () => modalAntec(),
  'ant-del': async (el) => { if (await confirmBox('Remover antecipação', 'Remover esta linha?', 'Remover', true)) { if (await finOp({ op: 'antec.set', lista: S.fin.antecipacoes.filter((a) => a.id !== el.dataset.id) })) toast('Removido.'); renderCurrent(); } }
};

const CHG = {
  'dash-ano': (el) => { S.dash.ano = +el.value; renderCurrent(); },
  'teso-filtro': (el) => { S.teso.filtro = el.value; renderCurrent(); },
  'fin-ano': (el) => { S.finUi.ano = +el.value; S.finUi.mFiltro = 0; renderCurrent(); },
  'mov-f-mes': (el) => { S.finUi.mFiltro = +el.value; renderCurrent(); },
  'mov-f-cat': (el) => { S.finUi.cat = el.value; renderCurrent(); },
  'mov-f-evento': (el) => { S.finUi.evento = el.value; renderCurrent(); },
  'mov-f-tipo': (el) => { S.finUi.tipo = el.value; renderCurrent(); },
  'mov-f-conta': (el) => { S.finUi.conta = el.value; renderCurrent(); },
  'mov-auto': (el) => { S.finUi.auto = el.checked; renderCurrent(); },
  'bulk-modo': (el) => { S.nuc.modo = el.value; renderCurrent(); },
  'mv-tipo': () => mvToggle(),
  'mv-cat': () => mvToggle()
};
const INP = {
  'dash-q': (el) => { S.dash.busca = el.value; renderCurrent(); },
  'nuc-q': (el) => { S.nuc.q = el.value; S.nuc.open = true; renderCurrent(); },
  'teso-q': (el) => { S.teso.q = el.value; renderCurrent(); },
  'comp-q': (el) => { S.compQ = el.value; renderCurrent(); },
  'mov-q': (el) => { S.finUi.q = el.value; renderCurrent(); },
  'bulk-dia': (el) => { S.nuc.dia = el.value; },
  'bulk-data': (el) => { S.nuc.data = el.value; }
};

document.addEventListener('click', (e) => {
  if (S.nuc.open && !e.target.closest('.combo')) { S.nuc.open = false; if (S.tab === 'nuc') renderCurrent(); }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTS[el.dataset.act];
  if (fn) { if (el.tagName === 'A') e.preventDefault(); Promise.resolve(fn(el, e)).catch((err) => { if (err && err.message !== 'auth') toast('Erro: ' + err.message, 'err'); }); }
});
document.addEventListener('change', (e) => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
document.addEventListener('input', (e) => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el); });
document.addEventListener('focusin', (e) => { if (e.target.id === 'nuc-q' && !S.nuc.open) { S.nuc.open = true; renderCurrent(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'lg-pass') { doLogin(); return; }
  if (e.key === 'Escape') {
    if (!$('#modal').hidden) closeModal(); else if (S.ficha) closeFicha(); else if (S.nuc.open) { S.nuc.open = false; renderCurrent(); }
    return;
  }
  if (e.key === 'Enter' && !$('#modal').hidden && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') {
    const p = $('#modal .btn.primary, #modal .btn.danger'); if (p) p.click();
  }
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.perfil && !$('#app').hidden && Date.now() - S.lastLoad > 30000 && $('#modal').hidden) reloadData();
});
window.addEventListener('error', (e) => { toast('Erro inesperado: ' + (e.message || 'desconhecido'), 'err'); });
window.addEventListener('unhandledrejection', (e) => { const m = e.reason && e.reason.message; if (m !== 'auth') toast('Erro inesperado: ' + (m || 'desconhecido'), 'err'); });

/* ===================== INÍCIO ===================== */
$$('.logo-img').forEach((i) => { i.src = LOGO_SRC; });
loadSession();
if (S.perfil) enterApp(); else showLogin('');


</script>
</body>
</html>
