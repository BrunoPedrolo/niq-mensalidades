services:
  - type: web
    name: niq-mensalidades
    env: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: niq-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/niq.db
      - key: NODE_ENV
        value: production
