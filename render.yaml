services:
  - type: web
    name: niq-mensalidades
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: BrunoPedrolo/niq-mensalidades
      - key: GITHUB_FILE
        value: data/db.json
      - key: GITHUB_BRANCH
        value: main
      - key: NODE_ENV
        value: production
